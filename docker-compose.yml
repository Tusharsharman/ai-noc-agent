services:

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-noc-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: ai-noc-grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus